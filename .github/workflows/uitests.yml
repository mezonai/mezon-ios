name: iOS UI Tests

on:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: macos-15
    steps:
      - name: Check Xcode and simulators
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: |
          xcodebuild -version
          xcrun simctl list devices available
