name: MezonChat

schemes:
  MezonChat:
    build:
      targets:
        MezonChat: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
  MezonSharing:
    build:
      targets:
        MezonSharing: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.12.1"
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework.git
    exactVersion: "137.7151.12"
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: "1.28.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.40.0"

options:
  bundleIdPrefix: mezon
  deploymentTarget:
    iOS: "13.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal

configs:
  Debug: debug
  Release: release

targets:
  MezonChat:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    configFiles:
      Debug: Pods/Target Support Files/Pods-MezonChat/Pods-MezonChat.debug.xcconfig
      Release: Pods/Target Support Files/Pods-MezonChat/Pods-MezonChat.release.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.Push:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: LiveKitWebRTC
        product: LiveKitWebRTC
      - package: SwiftProtobuf
        product: SwiftProtobuf
      - package: Sentry
        product: Sentry
      - target: NotificationService
      - target: MezonSharing
    sources:
      - path: MezonChat
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MezonChat/Resources/Assets.xcassets
      - path: MezonChat/Resources/Images.xcassets
      - path: MezonChat/Resources/Sounds
    preBuildScripts:
      - name: Validate Secrets.swift
        script: |
          if [ ! -f "${SRCROOT}/MezonChat/Networking/Secrets.swift" ]; then
            echo "error: Secrets.swift not found. Create it with prod values (see Secrets enum)."
            exit 1
          fi
          if [ ! -f "${SRCROOT}/MezonChat/GoogleService-Info.plist" ]; then
            echo "error: GoogleService-Info.plist not found. Download from Firebase Console."
            exit 1
          fi
        shell: /bin/sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Generate LiveKitWebRTC dSYM
        script: |
          /bin/sh "${SRCROOT}/scripts/generate_livekit_webrtc_dsym.sh"
        shell: /bin/sh
        basedOnDependencyAnalysis: false
      - name: Strip unlinked Sentry framework
        script: |
          /bin/sh "${SRCROOT}/scripts/strip_unlinked_sentry_framework.sh"
        shell: /bin/sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: mezon.mobile
        PRODUCT_NAME: Mezon
        MARKETING_VERSION: "1.2.106"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: MezonChat/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MezonChat/MezonChat.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: "MezonChat/MezonChat-Bridging-Header.h"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-target-os-checking"
        OTHER_LDFLAGS: "$(inherited)"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/MezonChat/Core/SSignalKit/SSignalKit/Source $(SRCROOT)/MezonChat/Core/Display $(SRCROOT)/MezonChat/Core/Display/UIKitRuntimeUtils $(SRCROOT)/MezonChat/Core/Display/ObjCRuntimeUtils $(SRCROOT)/MezonChat/Core/Display/AppBundle"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG ENABLE_LIVEKIT"
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "ENABLE_LIVEKIT"
    info:
      path: MezonChat/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mezon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: SplashScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).AppDelegate
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "mezon.mobile.sharing"
            CFBundleURLName: "mezon.mobile.sharing"
          - CFBundleURLSchemes:
              - "mezon"
              - "mezon.ai"
            CFBundleURLName: "ai.mezon.deeplink"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppleMusicUsageDescription: "We need access to Apple Music to play your selected songs"
        NSBluetoothAlwaysUsageDescription: "We need needs to use Bluetooth to detect connected headsets for mezon meeting"
        NSBluetoothPeripheralUsageDescription: "We need needs to use Bluetooth to detect connected headsets for mezon meeting"
        NSCameraUsageDescription: "Mezon app needs access to the camera to call video or take add pricture send to chat"
        NSLocationAlwaysAndWhenInUseUsageDescription: "We use your location to enhance your experience by showing nearby content and providing location-specific features when you're using the app. Your privacy is important to us, and we only access your location while you're actively using the app."
        NSLocationWhenInUseUsageDescription: "We use your location to enhance your experience by showing nearby content and providing location-specific features when you're using the app. Your privacy is important to us, and we only access your location while you're actively using the app."
        NSLocalNetworkUsageDescription: "Mezon needs access to your local network to establish peer-to-peer voice and video calls."
        NSBonjourServices:
          - "_mezon-call._udp"
          - "_mezon-call._tcp"
        NSMicrophoneUsageDescription: "Allow Mezon access to your microphone to enable voice chat"
        NSPasteboardUsageDescription: "Mezon needs access to the clipboard to paste content/images from other apps"
        NSPhotoLibraryAddUsageDescription: "Mezon app needs access to the photo library to select and send images in messages"
        NSPhotoLibraryUsageDescription: "Mezon app needs access to the photo library to select and send images in messages"
        UIBackgroundModes:
          - voip
          - remote-notification
          - audio
          - fetch

  NotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mezon.mobile.NotificationService
        PRODUCT_NAME: NotificationService
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  MezonSharing:
    type: app-extension
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: MezonSharing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mezon.mobile.MezonSharing
        PRODUCT_NAME: MezonSharing
        MARKETING_VERSION: "1.2.106"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MezonSharing/MezonSharing.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: "MezonSharing/MezonSharing-Bridging-Header.h"
    info:
      path: MezonSharing/Info.plist
      properties:
        CFBundleDisplayName: Mezon
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 100
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
            PHSupportedMediaTypes:
              - Video
              - Image
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
